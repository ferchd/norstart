name: Bug report
description: Report a reproducible defect in Norstar.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Include a minimal reproduction and the exact Bun version when possible.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: Clear, concise summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code/configuration example that reproduces the issue.
      render: typescript
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      placeholder: bun --version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and stack trace
      render: text
    validations:
      required: false
